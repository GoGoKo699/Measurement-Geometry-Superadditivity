name: Offline integration candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/integration-candidate.yml
      - publication/integration/complete-candidate.patch
      - publication/integration/CANDIDATE_CHECKS.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the proposed patch before applying it in this temporary checkout
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = json.loads(Path('publication/integration/CANDIDATE_CHECKS.json').read_text())
          expected = 'publication/integration/complete-candidate.patch'
          if record['patch'] != expected or record['starting_commit'] != '234e86439f44d7387134648ff088cf480ee1cd12':
              raise SystemExit('Unexpected candidate patch scope')
          if hashlib.sha256(Path(expected).read_bytes()).hexdigest() != record['patch_sha256']:
              raise SystemExit('Candidate patch digest differs')
          PY
          git apply --check publication/integration/complete-candidate.patch
          git apply publication/integration/complete-candidate.patch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
            website/requirements-browser.txt
      - name: Install the recorded reader dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            'https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb' \
            -o "$RUNNER_TEMP/candidate-pandoc.deb"
          sudo dpkg -i "$RUNNER_TEMP/candidate-pandoc.deb"
          test "$(pandoc --version | head -1)" = 'pandoc 3.1.11.1'
          python -m pip install -r requirements.txt -r website/requirements.txt -r website/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Check exact correction composition, integrity and generated readers
        run: |
          python publication/integration/check_candidate.py --output build/candidate-preservation.json
          python verify.py --report build/candidate-integrity.json
          python website/repository_preview.py --check
      - name: Run the candidate tests
        run: python -m pytest -q -p no:cacheprovider tests website/tests
      - name: Reproduce figures with the corrected documentary identities
        run: python reproduce.py --output build/candidate-figures
      - name: Build and check the candidate reader
        run: |
          python website/build.py --output build/candidate-site
          python website/check.py --site build/candidate-site --report build/candidate-structure.json
      - name: Review the candidate through actual loopback HTTP navigation
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory build/candidate-site > "$RUNNER_TEMP/candidate-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/index.html -o /dev/null && break
            sleep 1
          done
          python website/browser_check.py --site build/candidate-site --output build/candidate-browser --base-url http://127.0.0.1:8765
      - name: Retain candidate review evidence without committing or publishing the candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-integration-candidate
          path: |
            build/candidate-preservation.json
            build/candidate-integrity.json
            build/candidate-figures/
            build/candidate-site/
            build/candidate-structure.json
            build/candidate-browser/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
