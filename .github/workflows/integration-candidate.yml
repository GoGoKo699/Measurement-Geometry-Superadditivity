name: Integration preservation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the applied corrections and exact integration-stage changes
        run: |
          python3 publication/integration/check_integrated.py --output build/integration-preservation.json
          python3 website/repository_preview.py --check
      # Tests, figure replay, full science and actual loopback browser checks
      # run on this same commit in verify.yml and reader-site.yml.
      # The historical complete-candidate.patch is evidence, not a live patch.
      - name: Retain current preservation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-preservation
          path: build/integration-preservation.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
