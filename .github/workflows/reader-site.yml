name: Project reader site

on:
  push:
    branches: [main, reader/project-site-v1]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_PATH: ${{ github.workspace }}/build/mathml-tools/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
            website/requirements-browser.txt
      - name: Install pinned Markdown converter
        run: |
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            'https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb' \
            -o "$RUNNER_TEMP/pandoc.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          test "$(pandoc --version | head -1)" = 'pandoc 3.1.11.1'
      - name: Install recorded dependencies and browser
        run: |
          python -m pip install -r requirements.txt -r website/requirements.txt -r website/requirements-browser.txt
          mkdir -p build/mathml-tools
          cp website/package.json website/package-lock.json build/mathml-tools/
          npm ci --prefix build/mathml-tools --ignore-scripts --no-audit --no-fund
          python -m playwright install --with-deps chromium
      - name: Preserve the scientific baseline
        run: python verify.py --report build/reader-baseline-integrity.json
      - name: Existing and reader-site tests
        run: python -m pytest -q -p no:cacheprovider tests website/tests
      - name: Build a local reading artifact
        run: |
          python website/build.py --output build/project-site
          python website/check.py --site build/project-site --report build/reader-structure.json
      - name: Check native MathML and build the regression fixture
        run: node website/mathml_check.cjs --output build/project-site/mathml-regression
      - name: Test real local navigation, layouts and controls
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory build/project-site > "$RUNNER_TEMP/reader-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/index.html -o /dev/null && break
            sleep 1
          done
          python website/browser_check.py --site build/project-site --output build/reader-browser --base-url http://127.0.0.1:8765 --native-mathml
      - name: Upload review files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-reader-site
          path: |
            build/project-site/
            build/reader-browser/
            build/reader-structure.json
            build/reader-baseline-integrity.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
